name: sahhef
description: "صَحِّف | Journal it - Native Mobile App for Editorial Audio/Video Transcription & News Wire Synthesis"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & API
  dio: ^5.4.3+1

  # Native Device Capabilities
  file_picker: 13.3.0
  record: 7.1.2
  audioplayers: ^6.0.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  share_plus: 13.3.1

  # Typography & Styling
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.4.0
  url_launcher: 6.3.1
  shared_preferences: 2.3.2
  receive_sharing_intent: 1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/logo.jpg
    - assets/images/app_icon.png

name: journal_it_mobile
description: "Journal it — AI-Powered Mobile Investigative Journalism Studio for Voice & Video Interviews"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0
  receive_sharing_intent: ^1.4.8
  share_plus: ^7.2.2
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  flutter_secure_storage: ^9.0.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
